name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate Windows installer scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @('deploy.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./deploy.ps1
          $installRoot = Join-Path $env:LOCALAPPDATA 'VampYTD'
          foreach ($file in @('ytd.exe', 'bridge.exe', 'VampYTDExtension\manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot $file))) {
              throw "Installer did not create $file"
            }
          }
          ./uninstall.ps1
          if (Test-Path -LiteralPath $installRoot) {
            throw 'Uninstaller did not remove the installation directory'
          }
