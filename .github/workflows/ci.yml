name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows Test & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Tests
        shell: powershell
        run: go test -v ./...

      - name: Vet
        shell: powershell
        run: go vet ./...

      - name: Validate PowerShell Scripts
        shell: powershell
        run: |
          $scripts = @('deploy.ps1', 'uninstall.ps1', 'build.ps1', 'setup-dev.ps1', 'install.ps1')
          foreach ($script in $scripts) {
            if (Test-Path -LiteralPath $script) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path -LiteralPath $script),
                [ref]$tokens,
                [ref]$errors
              )
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                exit 1
              }
            }
          }

      - name: Test Build Script (Compile Binaries & Setup.exe)
        shell: powershell
        run: .\build.ps1

      - name: Test Windows install and uninstall
        shell: powershell
        run: |
          .\deploy.ps1
          $installRoot = Join-Path $env:LOCALAPPDATA 'VampYTD'
          foreach ($file in @('ytd.exe', 'bridge.exe', 'VampYTDExtension\manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot $file))) {
              throw "Installer did not create $file"
            }
          }
          .\uninstall.ps1
          if (Test-Path -LiteralPath $installRoot) {
            throw 'Uninstaller did not remove the installation directory'
          }
