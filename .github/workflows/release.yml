name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release metadata
        shell: bash
        run: |
          test -f LICENSE || { echo "LICENSE is required for a public release"; exit 1; }
          manifest_version="$(node -p "require('./VampYTDExtension/manifest.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "${manifest_version}" = "${tag_version}" || {
            echo "Extension version ${manifest_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          }
      - name: Test
        run: go test ./...
      - name: Create release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest checksums
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
