name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release metadata and ensure tag
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "LICENSE")) {
            throw "LICENSE is required for a public release"
          }
          $manifest = Get-Content -Raw "VampYTDExtension\manifest.json" | ConvertFrom-Json
          $manifestVersion = $manifest.version
          $targetTag = "v$manifestVersion"
          Write-Host "Target tag: $targetTag"
          "TARGET_TAG=$targetTag" | Out-File -FilePath $env:GITHUB_ENV -Append

          $currentRefType = $env:GITHUB_REF_TYPE
          $currentRefName = $env:GITHUB_REF_NAME

          if ($currentRefType -eq "tag") {
            $tagVersion = $currentRefName.TrimStart("v")
            if ($manifestVersion -ne $tagVersion) {
              throw "Extension version $manifestVersion does not match tag $currentRefName"
            }
          } else {
            git rev-parse "$targetTag" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Tag $targetTag already exists."
              git checkout "$targetTag"
            } else {
              Write-Host "Creating new release tag $targetTag..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$targetTag" -m "Release $targetTag"
              git push origin "$targetTag"
              git checkout "$targetTag"
            }
          }

      - name: Run Tests
        shell: powershell
        run: go test -v ./...

      - name: Compile Binaries and Standalone Installer
        shell: powershell
        run: .\build.ps1

      - name: Assemble Release Package and Checksums
        shell: powershell
        run: |
          $tag = $env:TARGET_TAG
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $stagingDir = "dist\VampYTD"
          if (Test-Path -LiteralPath $stagingDir) {
            Remove-Item -LiteralPath $stagingDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item -LiteralPath "ytd.exe" -Destination "$stagingDir\ytd.exe" -Force
          Copy-Item -LiteralPath "bridge.exe" -Destination "$stagingDir\bridge.exe" -Force
          Copy-Item -LiteralPath "deploy.ps1" -Destination "$stagingDir\deploy.ps1" -Force
          Copy-Item -LiteralPath "uninstall.ps1" -Destination "$stagingDir\uninstall.ps1" -Force
          Copy-Item -LiteralPath "Install-VampYTD.cmd" -Destination "$stagingDir\Install-VampYTD.cmd" -Force
          Copy-Item -LiteralPath "Uninstall-VampYTD.cmd" -Destination "$stagingDir\Uninstall-VampYTD.cmd" -Force
          Copy-Item -LiteralPath "README.md" -Destination "$stagingDir\README.md" -Force
          Copy-Item -LiteralPath "CHANGELOG.md" -Destination "$stagingDir\CHANGELOG.md" -Force
          Copy-Item -LiteralPath "LICENSE" -Destination "$stagingDir\LICENSE" -Force

          $extStaging = "$stagingDir\VampYTDExtension"
          New-Item -ItemType Directory -Path $extStaging -Force | Out-Null
          Copy-Item -Path "VampYTDExtension\*" -Destination $extStaging -Recurse -Force
          if (Test-Path -LiteralPath "$extStaging\manifest.firefox.json") {
            Remove-Item -LiteralPath "$extStaging\manifest.firefox.json" -Force
          }

          $zipName = "VampYTD_${tag}_windows_amd64.zip"
          $zipPath = "dist\$zipName"
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipPath -Force

          # Calculate SHA256 checksums
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "VampYTD-Setup.exe").Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLower()
          @(
            "$setupHash  VampYTD-Setup.exe",
            "$zipHash  $zipName"
          ) | Out-File -FilePath "dist\checksums.txt" -Encoding ascii

          Write-Host "`nRelease Assets Prepared in dist/:"
          Get-ChildItem dist

      - name: Publish Release via GitHub CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${TARGET_TAG}"
          zipFile="dist/VampYTD_${tag}_windows_amd64.zip"
          setupFile="VampYTD-Setup.exe"
          checksumsFile="dist/checksums.txt"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release $tag with compiled assets..."
            gh release upload "$tag" "$setupFile" "$zipFile" "$checksumsFile" --clobber
          else
            echo "Creating release $tag..."
            gh release create "$tag" "$setupFile" "$zipFile" "$checksumsFile" --title "VampYTD $tag" --generate-notes
          fi
